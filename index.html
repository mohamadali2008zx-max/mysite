<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>brOzeAli</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f1e7; --ink:#1d1b3a; --muted:#6a6786; --a:#ff4d6d; --b:#ffb703; --c:#7b2ff7; --card:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14122b; --ink:#f6f1e7; --muted:#a9a6c6; --card:#201d42; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#14122b; --ink:#f6f1e7; --muted:#a9a6c6; --card:#201d42; color-scheme:dark;}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Tahoma,"Segoe UI",system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:24px;
  box-sizing:border-box;
}
main{width:100%; max-width:380px; text-align:center}
.ring{
  width:132px; height:132px; margin:0 auto 28px; border-radius:50%; padding:5px;
  background:conic-gradient(var(--b),var(--a),var(--c),var(--b));
}
.ring div{
  width:100%; height:100%; border-radius:50%; background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  font:700 54px/1 Georgia,"Times New Roman",serif; direction:ltr; letter-spacing:-2px;
}
h1{margin:0 0 6px; font:700 34px/1.2 Georgia,"Times New Roman",serif; direction:ltr; letter-spacing:-.5px}
p{margin:0 0 32px; color:var(--muted); font-size:16px; line-height:1.8}
a.btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  padding:16px 20px; border-radius:18px; text-decoration:none; color:#fff; font-weight:700; font-size:17px;
  background:linear-gradient(100deg,var(--c),var(--a) 60%,var(--b));
  transition:transform .15s ease;
}
a.btn:active{transform:scale(.97)}
a.btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
a.btn svg{width:22px;height:22px;flex:none}
.handle{margin-top:16px; color:var(--muted); font-size:14px; direction:ltr}
</style>
</head>
<body>
<main>
  <div class="ring"><div>A</div></div>
  <h1>brOzeAli</h1>
  <p>من رو توی اینستاگرام دنبال کن</p>
  <a class="btn" href="https://www.instagram.com/brOzeAli/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
    باز کردن اینستاگرام
  </a>
  <div class="handle">@brOzeAli</div>
</main>
</body>
</html>
