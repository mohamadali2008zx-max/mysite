<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0605">
<title>Mohammadali Ansarikhah</title>
<meta name="description" content="Mohammadali Ansarikhah | محمدعلی انصاری‌خواه — Peace of mind. Instagram, Telegram and Threads.">
<style>
:root{color-scheme:dark;--bg:#0a0605;--ink:#fbeedd;--muted:#c9a98c;--e1:#ffb347;--e2:#ff6a1a;--e3:#b3260c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 70% at 50% 108%,#4a1305 0%,#1a0a06 45%,var(--bg) 78%)}
body{background:var(--bg);color:var(--ink);
 font-family:Tahoma,"Segoe UI",system-ui,sans-serif;overflow-x:hidden;
 padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:32px 24px;text-align:center;max-width:420px;margin:0 auto;animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.photo{position:relative;width:156px;height:156px;margin-bottom:34px}
.photo::before{content:"";position:absolute;inset:-34px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,106,26,.55),rgba(179,38,12,.25) 55%,transparent 72%);
 animation:breathe 8s ease-in-out infinite}
.photo::after{content:"";position:absolute;inset:-5px;border-radius:50%;
 background:conic-gradient(from 200deg,var(--e1),var(--e2),var(--e3),var(--e1));
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
 mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
 animation:breathe 8s ease-in-out infinite}
.photo img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
 animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.045);opacity:1}}
h1{margin:0;font:700 32px/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.5px;direction:ltr}
.fa{margin:10px 0 18px;font-size:19px;color:var(--ink);opacity:.92}
.bio{margin:0 0 40px;font:italic 22px/1.4 Georgia,"Times New Roman",serif;color:var(--e1);direction:ltr;letter-spacing:.5px;
 text-shadow:0 0 22px rgba(255,106,26,.5)}
a.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:17px 20px;border-radius:999px;
 text-decoration:none;color:#1a0904;font-weight:700;font-size:17px;
 background:linear-gradient(100deg,var(--e1),var(--e2));box-shadow:0 10px 36px rgba(255,106,26,.38);transition:transform .2s,box-shadow .2s}
a.btn:hover{transform:translateY(-2px);box-shadow:0 14px 44px rgba(255,106,26,.55)}
a.btn:active{transform:scale(.97)}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
a.btn svg{width:22px;height:22px;flex:none}
.id{margin-top:18px;color:var(--muted);font-size:14px;direction:ltr;letter-spacing:.4px}
.cue{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:26px;line-height:1;color:var(--muted);opacity:.7;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.links{position:relative;max-width:420px;margin:0 auto;padding:40px 24px calc(72px + env(safe-area-inset-bottom,0px));text-align:center}
.links h2{margin:0 0 6px;font:italic 26px/1.3 Georgia,"Times New Roman",serif;color:var(--e1);direction:ltr;text-shadow:0 0 22px rgba(255,106,26,.45)}
.links p{margin:0 0 26px;color:var(--muted);font-size:15px}
.row{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:15px 18px;border-radius:20px;text-decoration:none;color:var(--ink);text-align:start;
 background:rgba(255,255,255,.05);border:1px solid rgba(255,179,71,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 transition:transform .2s,border-color .2s,background .2s}
.row:hover{transform:translateY(-2px);border-color:rgba(255,179,71,.55);background:rgba(255,255,255,.08)}
.row:active{transform:scale(.98)}
.row:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ic{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#1a0904;
 background:linear-gradient(135deg,var(--e1),var(--e2));font:700 22px/1 Georgia,serif}
.ic svg{width:22px;height:22px}
.tx{flex:1;min-width:0;direction:ltr;text-align:left}
.tx b{display:block;font-size:17px}
.tx span{display:block;margin-top:2px;font-size:14px;color:var(--muted)}
.go{flex:none;color:var(--e1);font-size:20px;direction:ltr}
.js .row{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1),border-color .2s,background .2s}
.js .row.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .row{opacity:1;transform:none;transition:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script>document.documentElement.classList.add("js")</script>

<script>
(function(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 var c=document.getElementById('c'),x=c.getContext('2d'),W,H,P=[],D=Math.min(devicePixelRatio||1,2);
 function size(){W=c.width=innerWidth*D;H=c.height=innerHeight*D}
 function mk(init){return{x:Math.random()*W,y:init?Math.random()*H:H+20,r:(.6+Math.random()*2)*D,
  v:(.25+Math.random()*.7)*D,s:Math.random()*6.28,a:.3+Math.random()*.6}}
 size();addEventListener('resize',size);
 for(var i=0;i<46;i++)P.push(mk(true));
 (function f(){
  x.clearRect(0,0,W,H);
  for(var i=0;i<P.length;i++){var p=P[i];
   p.y-=p.v;p.s+=.012;p.x+=Math.sin(p.s)*.5*D;
   var k=p.y/H;if(p.y<-20){P[i]=mk(false);continue}
   x.globalAlpha=p.a*Math.min(1,k*1.6);
   x.fillStyle=k>.5?'#ff8a2a':'#ffc36b';
   x.shadowColor='#ff6a1a';x.shadowBlur=10*D;
   x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()}
  requestAnimationFrame(f)})();
})();
</script>
